<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SoundsFriends</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #121212;
      color: white;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 240px;
      background-color: #000;
      padding: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 40px;
      color: #1DB954;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .menu button {
      background: none;
      border: none;
      color: #b3b3b3;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu button:hover {
      color: white;
    }

    /* MAIN */

    .main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .title {
      font-size: 32px;
      margin-bottom: 25px;
    }

    .songs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: #181818;
      padding: 15px;
      border-radius: 12px;
      transition: 0.25s;
      cursor: pointer;
    }

    .card:hover {
      background-color: #282828;
      transform: scale(1.03);
    }

    .cover {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .song-title {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .artist {
      color: #b3b3b3;
      font-size: 14px;
    }

    /* PLAYER */

    .player {
      position: fixed;
      bottom: 0;
      left: 240px;
      right: 0;
      height: 90px;
      background-color: #181818;
      border-top: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    audio {
      width: 90%;
    }

  </style>
</head>
<body>

  <div class="app">

    <!-- SIDEBAR -->

    <div class="sidebar">
      <div class="logo">MyMusic</div>

      <div class="menu">
        <button>🏠 Home</button>
        <button>🔍 Search</button>
        <button>📚 Library</button>
      </div>
    </div>

    <!-- MAIN -->

    <div class="main">

      <h1 class="title">Your Songs</h1>

      <div class="songs">

        <div class="card" onclick="playSong('songs/song1.mp3')">
          <img class="cover" src="https://picsum.photos/300?1">
          <div class="song-title">Sounds</div>
          <div class="artist">Radioxians</div>
        </div>

        <div class="card" onclick="playSong('songs/song2.mp3')">
          <img class="cover" src="https://picsum.photos/300?2">
          <div class="song-title">Friends</div>
          <div class="artist">Radioxians</div>
        </div>

        <div class="card" onclick="playSong('songs/song3.mp3')">
          <img class="cover" src="https://picsum.photos/300?3">
          <div class="song-title">[BETA]</div>
          <div class="artist">Radioxians</div>
        </div>

      </div>

    </div>

  </div>

  <!-- PLAYER -->

  <div class="player">
    <audio id="audioPlayer" controls>
      <source src="" type="audio/mpeg">
    </audio>
  </div>

  <script>

    const player = document.getElementById("audioPlayer");

    function playSong(songPath) {
      player.src = songPath;
      player.play();
    }

  </script>

</body>
</html>
